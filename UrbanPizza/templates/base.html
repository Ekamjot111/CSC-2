<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Urban Pizza - Online Order{% endblock %}</title>
   <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Urban Pizza Online Store</h1>
        <nav> 
            <a href="{{ url_for('index') }}">Home & Order</a>
            <a href="{{ url_for('menu') }}">Our Menu</a>
            <a href="{{ url_for('order_history') }}">My Orders</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; 2026 Urban Pizza. All rights reserved.</p>
    </footer>
</body>
</html>
